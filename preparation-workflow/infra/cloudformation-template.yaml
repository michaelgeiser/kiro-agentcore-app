  # =========================================================================
  # Step Functions State Machine
  # =========================================================================

  StateMachineLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/stepfunctions/${AppName}-${EnvName}-preparation-workflow'
      RetentionInDays: 14

  StateMachineRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${AppName}-${EnvName}-prep-sfn-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: states.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: LambdaInvoke
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource:
                  - !GetAtt LoadConfigFunction.Arn
                  - !GetAtt ParseMessageFunction.Arn
                  - !GetAtt ValidateFormatFunction.Arn
                  - !GetAtt ExtractAudioFunction.Arn
                  - !GetAtt ChunkAudioFunction.Arn
                  - !GetAtt CreateEmbeddingFunction.Arn
                  - !GetAtt StoreVectorsFunction.Arn
                  - !GetAtt PublishHandoffFunction.Arn
                  - !GetAtt HandleFailureFunction.Arn
        - PolicyName: DynamoDBUpdate
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: dynamodb:UpdateItem
                Resource: !Sub 'arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${AppName}-${EnvName}-submissions'
        - PolicyName: CloudWatchLogs
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogDelivery
                  - logs:GetLogDelivery
                  - logs:UpdateLogDelivery
                  - logs:DeleteLogDelivery
                  - logs:ListLogDeliveries
                  - logs:PutResourcePolicy
                  - logs:DescribeResourcePolicies
                  - logs:DescribeLogGroups
                Resource: '*'

  PreparationWorkflowStateMachine:
    Type: AWS::StepFunctions::StateMachine
    DependsOn:
      - LoadConfigFunction
      - ParseMessageFunction
      - ValidateFormatFunction
      - ExtractAudioFunction
      - ChunkAudioFunction
      - CreateEmbeddingFunction
      - StoreVectorsFunction
      - PublishHandoffFunction
      - HandleFailureFunction
    Properties:
      StateMachineName: !Sub '${AppName}-${EnvName}-preparation-workflow'
      StateMachineType: STANDARD
      RoleArn: !GetAtt StateMachineRole.Arn
      LoggingConfiguration:
        Destinations:
          - CloudWatchLogsLogGroup:
              LogGroupArn: !GetAtt StateMachineLogGroup.Arn
        IncludeExecutionData: true
        Level: ALL
      DefinitionString: !Sub |
        {
          "Comment": "Preparation Workflow - Standard Workflow for audio/video processing pipeline",
          "StartAt": "LoadConfig",
          "States": {
            "LoadConfig": {
              "Type": "Task",
              "Resource": "arn:aws:states:::lambda:invoke",
              "Parameters": {
                "FunctionName": "${LoadConfigFunction.Arn}",
                "Payload.$": "$"
              },
              "ResultPath": "$.config",
              "ResultSelector": {"value.$": "$.Payload"},
              "Retry": [{"ErrorEquals": ["States.TaskFailed","States.Timeout"], "IntervalSeconds": 2, "BackoffRate": 2.0, "MaxAttempts": 3, "JitterStrategy": "FULL"}],
              "Catch": [{"ErrorEquals": ["States.ALL"], "Next": "HandleFailure", "ResultPath": "$.error_info"}],
              "Next": "ParseMessage"
            },
            "ParseMessage": {
              "Type": "Task",
              "Resource": "arn:aws:states:::lambda:invoke",
              "Parameters": {
                "FunctionName": "${ParseMessageFunction.Arn}",
                "Payload.$": "$"
              },
              "ResultPath": "$.parsed_message",
              "ResultSelector": {"value.$": "$.Payload"},
              "Retry": [{"ErrorEquals": ["States.TaskFailed","States.Timeout"], "IntervalSeconds": 2, "BackoffRate": 2.0, "MaxAttempts": 3, "JitterStrategy": "FULL"}],
              "Catch": [{"ErrorEquals": ["States.ALL"], "Next": "HandleFailure", "ResultPath": "$.error_info"}],
              "Next": "UpdateStatusProcessing"
            },
            "UpdateStatusProcessing": {
              "Type": "Task",
              "Resource": "arn:aws:states:::dynamodb:updateItem",
              "Parameters": {
                "TableName": "${AppName}-${EnvName}-submissions",
                "Key": {"submission_id": {"S.$": "$.parsed_message.value.submission_id"}},
                "UpdateExpression": "SET processing_status = :status",
                "ExpressionAttributeValues": {":status": {"S": "Processing"}}
              },
              "ResultPath": "$.dynamodb_update_processing",
              "Retry": [{"ErrorEquals": ["States.TaskFailed","States.Timeout"], "IntervalSeconds": 1, "BackoffRate": 2.0, "MaxAttempts": 3, "JitterStrategy": "FULL"}],
              "Catch": [{"ErrorEquals": ["States.ALL"], "Next": "HandleFailure", "ResultPath": "$.error_info"}],
              "Next": "ValidateFileFormat"
            },
            "ValidateFileFormat": {
              "Type": "Task",
              "Resource": "arn:aws:states:::lambda:invoke",
              "Parameters": {
                "FunctionName": "${ValidateFormatFunction.Arn}",
                "Payload": {
                  "original_file_name.$": "$.parsed_message.value.original_file_name",
                  "video_processing_enabled.$": "$.config.value.video_processing_enabled"
                }
              },
              "ResultPath": "$.validation_result",
              "ResultSelector": {"value.$": "$.Payload"},
              "Retry": [{"ErrorEquals": ["States.TaskFailed","States.Timeout"], "IntervalSeconds": 2, "BackoffRate": 2.0, "MaxAttempts": 3, "JitterStrategy": "FULL"}],
              "Catch": [{"ErrorEquals": ["States.ALL"], "Next": "HandleFailure", "ResultPath": "$.error_info"}],
              "Next": "CheckVideoFlag"
            },
            "CheckVideoFlag": {
              "Type": "Choice",
              "Choices": [
                {"Variable": "$.validation_result.value.decision", "StringEquals": "embed", "Next": "ChunkAudio"},
                {"Variable": "$.validation_result.value.decision", "StringEquals": "extract_audio", "Next": "ExtractAudio"},
                {"Variable": "$.validation_result.value.decision", "StringEquals": "fail", "Next": "HandleFailure"}
              ],
              "Default": "HandleFailure"
            },
            "ExtractAudio": {
              "Type": "Task",
              "Resource": "arn:aws:states:::lambda:invoke",
              "Parameters": {
                "FunctionName": "${ExtractAudioFunction.Arn}",
                "Payload": {
                  "s3_bucket.$": "$.parsed_message.value.s3_bucket",
                  "s3_file_key.$": "$.parsed_message.value.s3_file_key",
                  "user_id.$": "$.parsed_message.value.user_id",
                  "submission_id.$": "$.parsed_message.value.submission_id",
                  "config.$": "$.config.value"
                }
              },
              "ResultPath": "$.extraction_result",
              "ResultSelector": {"value.$": "$.Payload"},
              "Retry": [{"ErrorEquals": ["States.TaskFailed","States.Timeout"], "IntervalSeconds": 30, "BackoffRate": 2.0, "MaxAttempts": 3, "JitterStrategy": "FULL"}],
              "Catch": [{"ErrorEquals": ["States.ALL"], "Next": "HandleFailure", "ResultPath": "$.error_info"}],
              "Next": "ChunkAudio"
            },
            "ChunkAudio": {
              "Type": "Task",
              "Resource": "arn:aws:states:::lambda:invoke",
              "Parameters": {
                "FunctionName": "${ChunkAudioFunction.Arn}",
                "Payload": {
                  "s3_bucket.$": "$.parsed_message.value.s3_bucket",
                  "s3_file_key.$": "$.parsed_message.value.s3_file_key",
                  "user_id.$": "$.parsed_message.value.user_id",
                  "submission_id.$": "$.parsed_message.value.submission_id",
                  "config.$": "$.config.value",
                  "extraction_result.$": "$.extraction_result"
                }
              },
              "ResultPath": "$.chunks",
              "ResultSelector": {"value.$": "$.Payload"},
              "Retry": [{"ErrorEquals": ["States.TaskFailed","States.Timeout"], "IntervalSeconds": 2, "BackoffRate": 2.0, "MaxAttempts": 3, "JitterStrategy": "FULL"}],
              "Catch": [{"ErrorEquals": ["States.ALL"], "Next": "HandleFailure", "ResultPath": "$.error_info"}],
              "Next": "CreateEmbeddings"
            },
            "CreateEmbeddings": {
              "Type": "Map",
              "ItemsPath": "$.chunks.value.chunks",
              "MaxConcurrency": 10,
              "Parameters": {
                "chunk.$": "$$.Map.Item.Value",
                "config.$": "$.config.value",
                "submission_id.$": "$.parsed_message.value.submission_id",
                "user_id.$": "$.parsed_message.value.user_id"
              },
              "Iterator": {
                "StartAt": "ProcessChunkEmbedding",
                "States": {
                  "ProcessChunkEmbedding": {
                    "Type": "Task",
                    "Resource": "arn:aws:states:::lambda:invoke",
                    "Parameters": {
                      "FunctionName": "${CreateEmbeddingFunction.Arn}",
                      "Payload.$": "$"
                    },
                    "ResultSelector": {"value.$": "$.Payload"},
                    "Retry": [{"ErrorEquals": ["States.TaskFailed","States.Timeout"], "IntervalSeconds": 5, "BackoffRate": 2.0, "MaxAttempts": 3, "JitterStrategy": "FULL"}],
                    "End": true
                  }
                }
              },
              "ResultPath": "$.embeddings",
              "Catch": [{"ErrorEquals": ["States.ALL"], "Next": "HandleFailure", "ResultPath": "$.error_info"}],
              "Next": "StoreVectors"
            },
            "StoreVectors": {
              "Type": "Task",
              "Resource": "arn:aws:states:::lambda:invoke",
              "Parameters": {
                "FunctionName": "${StoreVectorsFunction.Arn}",
                "Payload": {
                  "embeddings.$": "$.embeddings",
                  "submission_id.$": "$.parsed_message.value.submission_id",
                  "user_id.$": "$.parsed_message.value.user_id",
                  "config.$": "$.config.value"
                }
              },
              "ResultPath": "$.store_result",
              "ResultSelector": {"value.$": "$.Payload"},
              "Retry": [{"ErrorEquals": ["States.TaskFailed","States.Timeout"], "IntervalSeconds": 2, "BackoffRate": 2.0, "MaxAttempts": 3, "JitterStrategy": "FULL"}],
              "Catch": [{"ErrorEquals": ["States.ALL"], "Next": "HandleFailure", "ResultPath": "$.error_info"}],
              "Next": "PublishHandoff"
            },
            "PublishHandoff": {
              "Type": "Task",
              "Resource": "arn:aws:states:::lambda:invoke",
              "Parameters": {
                "FunctionName": "${PublishHandoffFunction.Arn}",
                "Payload": {
                  "submission_id.$": "$.parsed_message.value.submission_id",
                  "user_id.$": "$.parsed_message.value.user_id",
                  "s3_file_key.$": "$.parsed_message.value.s3_file_key",
                  "presentation_title.$": "$.parsed_message.value.presentation_title",
                  "store_result.$": "$.store_result.value",
                  "chunks.$": "$.chunks.value",
                  "config.$": "$.config.value"
                }
              },
              "ResultPath": "$.handoff_result",
              "ResultSelector": {"value.$": "$.Payload"},
              "Retry": [{"ErrorEquals": ["States.TaskFailed","States.Timeout"], "IntervalSeconds": 2, "BackoffRate": 2.0, "MaxAttempts": 3, "JitterStrategy": "FULL"}],
              "Catch": [{"ErrorEquals": ["States.ALL"], "Next": "HandleFailure", "ResultPath": "$.error_info"}],
              "Next": "UpdateStatusCompleted"
            },
            "UpdateStatusCompleted": {
              "Type": "Task",
              "Resource": "arn:aws:states:::dynamodb:updateItem",
              "Parameters": {
                "TableName": "${AppName}-${EnvName}-submissions",
                "Key": {"submission_id": {"S.$": "$.parsed_message.value.submission_id"}},
                "UpdateExpression": "SET processing_status = :status",
                "ExpressionAttributeValues": {":status": {"S": "Completed"}}
              },
              "ResultPath": "$.dynamodb_update_completed",
              "Retry": [{"ErrorEquals": ["States.TaskFailed","States.Timeout"], "IntervalSeconds": 1, "BackoffRate": 2.0, "MaxAttempts": 3, "JitterStrategy": "FULL"}],
              "Catch": [{"ErrorEquals": ["States.ALL"], "Next": "HandleFailure", "ResultPath": "$.error_info"}],
              "End": true
            },
            "HandleFailure": {
              "Type": "Task",
              "Resource": "arn:aws:states:::lambda:invoke",
              "Parameters": {
                "FunctionName": "${HandleFailureFunction.Arn}",
                "Payload": {
                  "execution_input.$": "$",
                  "error_info.$": "$.error_info"
                }
              },
              "ResultSelector": {"value.$": "$.Payload"},
              "End": true
            }
          }
        }

  # =========================================================================
  # EventBridge Pipe: SQS Input Queue → Step Functions
  # =========================================================================

  PipeRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${AppName}-${EnvName}-prep-pipe-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: pipes.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: PipePolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - sqs:ReceiveMessage
                  - sqs:DeleteMessage
                  - sqs:GetQueueAttributes
                Resource: !GetAtt InputQueue.Arn
              - Effect: Allow
                Action: states:StartExecution
                Resource: !GetAtt PreparationWorkflowStateMachine.Arn

  InputToStepFunctionsPipe:
    Type: AWS::Pipes::Pipe
    Properties:
      Name: !Sub '${AppName}-${EnvName}-prep-input-to-sfn'
      RoleArn: !GetAtt PipeRole.Arn
      Source: !GetAtt InputQueue.Arn
      SourceParameters:
        SqsQueueParameters:
          BatchSize: 1
          MaximumBatchingWindowInSeconds: 0
      Target: !GetAtt PreparationWorkflowStateMachine.Arn
      TargetParameters:
        StepFunctionStateMachineParameters:
          InvocationType: FIRE_AND_FORGET

Outputs:
  StateMachineArn:
    Value: !GetAtt PreparationWorkflowStateMachine.Arn
    Description: Preparation Workflow state machine ARN
  InputQueueUrl:
    Value: !Ref InputQueue
    Description: SQS Input Queue URL
  HandoffQueueUrl:
    Value: !Ref HandoffQueue
    Description: SQS Handoff Queue URL (FIFO)
  ErrorTopicArn:
    Value: !Ref ErrorTopic
    Description: SNS Error Topic ARN
  DLQInputUrl:
    Value: !Ref DLQInput
    Description: Input Dead Letter Queue URL
  DLQHandoffUrl:
    Value: !Ref DLQHandoff
    Description: Handoff Dead Letter Queue URL (FIFO)
  VectorStoreBucketName:
    Value: !Ref VectorStoreBucket
    Description: S3 bucket for vector embeddings storage
