AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Preparation Workflow Infrastructure - Step Functions, Lambda functions,
  SQS queues, SNS topic, SSM parameters, and EventBridge Pipe.

Parameters:
  EnvName:
    Type: String
    Default: dev
    Description: Deployment environment (dev, staging, prod)
  AppName:
    Type: String
    Default: prescoach
    Description: Application name prefix
  LambdaCodeBucket:
    Type: String
    Description: S3 bucket containing Lambda deployment package
    Default: ''
  LambdaCodeKey:
    Type: String
    Description: S3 key for Lambda deployment package (zip)
    Default: ''

Conditions:
  HasLambdaCode: !Not [!Equals [!Ref LambdaCodeBucket, '']]

Resources:

  # =========================================================================
  # SQS Queues
  # =========================================================================

  DLQInput:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub '${AppName}-${EnvName}-preparation-dlq-input'
      MessageRetentionPeriod: 1209600  # 14 days

  InputQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub '${AppName}-${EnvName}-preparation-input'
      VisibilityTimeout: 900  # 15 minutes
      MessageRetentionPeriod: 604800  # 7 days
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt DLQInput.Arn
        maxReceiveCount: 3

  DLQHandoff:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub '${AppName}-${EnvName}-preparation-dlq-handoff.fifo'
      FifoQueue: true
      MessageRetentionPeriod: 1209600

  HandoffQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub '${AppName}-${EnvName}-preparation-handoff.fifo'
      FifoQueue: true
      ContentBasedDeduplication: true
      VisibilityTimeout: 300  # 5 minutes
      MessageRetentionPeriod: 604800
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt DLQHandoff.Arn
        maxReceiveCount: 3

  # =========================================================================
  # SNS Topic
  # =========================================================================

  ErrorTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub '${AppName}-${EnvName}-preparation-errors'
      DisplayName: Preparation Workflow Error Notifications

  # =========================================================================
  # S3 Vector Store Bucket
  # =========================================================================

  VectorStoreBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub '${AppName}-${EnvName}-vectors-${AWS::AccountId}-${AWS::Region}'
      VersioningConfiguration:
        Status: Enabled
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionRule:
              ServerSideEncryptionByDefault:
                SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: TransitionToIA
            Status: Enabled
            Transitions:
              - StorageClass: STANDARD_IA
                TransitionInDays: 90

  # =========================================================================
  # SSM Parameters
  # =========================================================================

  SSMEmbeddingModelId:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub '/prescoach/${EnvName}/preparation-workflow/embedding-model-id'
      Type: String
      Value: 'amazon.nova-embed-multimodal-v1:0'
      Description: Bedrock model identifier for embedding creation

  SSMChunkSizeSeconds:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub '/prescoach/${EnvName}/preparation-workflow/chunk-size-seconds'
      Type: String
      Value: '30'
      Description: Audio chunk duration in seconds

  SSMChunkOverlapSeconds:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub '/prescoach/${EnvName}/preparation-workflow/chunk-overlap-seconds'
      Type: String
      Value: '5'
      Description: Overlap between consecutive audio chunks in seconds

  SSMMaxRetryAttempts:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub '/prescoach/${EnvName}/preparation-workflow/max-retry-attempts'
      Type: String
      Value: '3'
      Description: Maximum retry count for service calls

  SSMVideoProcessingEnabled:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub '/prescoach/${EnvName}/preparation-workflow/video-processing-enabled'
      Type: String
      Value: 'false'
      Description: Feature flag for video file processing

  SSMVectorStoreEndpoint:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub '/prescoach/${EnvName}/preparation-workflow/vector-store-endpoint'
      Type: String
      Value: !Ref VectorStoreBucket
      Description: Vector store S3 bucket name

  SSMVectorStoreType:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub '/prescoach/${EnvName}/preparation-workflow/vector-store-type'
      Type: String
      Value: 's3'
      Description: Vector store type (s3, opensearch, etc.)

  SSMBatchSize:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub '/prescoach/${EnvName}/preparation-workflow/batch-size'
      Type: String
      Value: '10'
      Description: Number of chunks per batch embedding call

  SSMBatchProcessingEnabled:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub '/prescoach/${EnvName}/preparation-workflow/batch-processing-enabled'
      Type: String
      Value: 'false'
      Description: Feature flag for batch embedding processing

  # =========================================================================
  # IAM Roles for Lambda Functions
  # =========================================================================

  LambdaBaseRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${AppName}-${EnvName}-prep-lambda-base'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: SSMReadAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - ssm:GetParameter
                  - ssm:GetParametersByPath
                Resource: !Sub 'arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/prescoach/${EnvName}/preparation-workflow/*'

  ExtractAudioRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${AppName}-${EnvName}-prep-extract-audio'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: MediaConvertAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - mediaconvert:CreateJob
                  - mediaconvert:GetJob
                  - mediaconvert:DescribeEndpoints
                Resource: '*'
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                Resource: !Sub 'arn:aws:s3:::${AppName}-${EnvName}-*/*'
              - Effect: Allow
                Action: iam:PassRole
                Resource: !Sub 'arn:aws:iam::${AWS::AccountId}:role/${AppName}-${EnvName}-mediaconvert-role'

  ChunkAudioRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${AppName}-${EnvName}-prep-chunk-audio'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: S3Access
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                Resource: !Sub 'arn:aws:s3:::${AppName}-${EnvName}-*/*'

  CreateEmbeddingRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${AppName}-${EnvName}-prep-create-embedding'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: BedrockAndS3Access
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: bedrock:InvokeModel
                Resource: !Sub 'arn:aws:bedrock:${AWS::Region}::foundation-model/*'
              - Effect: Allow
                Action: s3:GetObject
                Resource: !Sub 'arn:aws:s3:::${AppName}-${EnvName}-*/*'

  StoreVectorsRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${AppName}-${EnvName}-prep-store-vectors'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: S3WriteAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:GetObject
                Resource: !Sub '${VectorStoreBucket.Arn}/*'

  PublishHandoffRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${AppName}-${EnvName}-prep-publish-handoff'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: SQSSendAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - sqs:SendMessage
                  - sqs:GetQueueUrl
                Resource: !GetAtt HandoffQueue.Arn

  HandleFailureRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${AppName}-${EnvName}-prep-handle-failure'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: FailureHandlerAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: dynamodb:UpdateItem
                Resource: !Sub 'arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${AppName}-${EnvName}-submissions'
              - Effect: Allow
                Action: sns:Publish
                Resource: !Ref ErrorTopic
              - Effect: Allow
                Action:
                  - sqs:SendMessage
                  - sqs:GetQueueUrl
                Resource:
                  - !GetAtt DLQInput.Arn
                  - !GetAtt DLQHandoff.Arn

