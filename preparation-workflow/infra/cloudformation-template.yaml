      MemorySize: 256
      Description: Fetch SSM parameters for workflow configuration
      Environment:
        Variables:
          ENV_NAME: !Ref EnvName
          SSM_PREFIX: !Sub '/prescoach/${EnvName}/preparation-workflow'
      Code:
