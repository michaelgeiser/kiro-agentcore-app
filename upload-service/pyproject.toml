[project]
name = "upload-service"
version = "0.1.0"
description = "Upload and Storage service for the Presentation Coaching Platform"
requires-python = ">=3.12"
license = {text = "MIT"}

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "--tb=short -q"

[tool.hypothesis]
max_examples = 100
deadline = 500

[tool.coverage.run]
source = ["src"]
omit = ["tests/*", "cdk/*"]

[tool.coverage.report]
show_missing = true
fail_under = 80
