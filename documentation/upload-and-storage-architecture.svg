<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 750" font-family="Amazon Ember, Helvetica Neue, Arial, sans-serif">
  <defs>
    <!-- AWS Orange gradient for headers -->
    <linearGradient id="awsOrange" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#FF9900"/>
      <stop offset="100%" style="stop-color:#FFB84D"/>
    </linearGradient>
    <!-- Arrow marker -->
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#545B64"/>
    </marker>
    <marker id="arrowhead-orange" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#FF9900"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1200" height="750" fill="#FFFFFF"/>

  <!-- Title -->
  <text x="600" y="35" text-anchor="middle" font-size="18" font-weight="bold" fill="#232F3E">Upload and Storage Service — Architecture Diagram</text>
  <text x="600" y="55" text-anchor="middle" font-size="11" fill="#545B64">prescoach-dev-kiro</text>

  <!-- AWS Cloud boundary -->
  <rect x="30" y="70" width="1140" height="650" rx="8" ry="8" fill="none" stroke="#232F3E" stroke-width="2" stroke-dasharray="8,4"/>
  <rect x="30" y="70" width="140" height="24" rx="4" ry="4" fill="#232F3E"/>
  <text x="100" y="86" text-anchor="middle" font-size="11" fill="#FFFFFF" font-weight="bold">AWS Cloud</text>

  <!-- User/Client -->
  <rect x="50" y="310" width="100" height="80" rx="6" ry="6" fill="#F2F3F3" stroke="#232F3E" stroke-width="1.5"/>
  <text x="100" y="340" text-anchor="middle" font-size="10" fill="#232F3E" font-weight="bold">User</text>
  <text x="100" y="356" text-anchor="middle" font-size="9" fill="#545B64">(Browser)</text>
  <!-- Person icon -->
  <circle cx="100" cy="375" r="8" fill="none" stroke="#232F3E" stroke-width="1.5"/>
  <line x1="100" y1="383" x2="100" y2="395" stroke="#232F3E" stroke-width="1.5"/>

  <!-- Cognito -->
  <rect x="200" y="130" width="130" height="70" rx="6" ry="6" fill="#FFFFFF" stroke="#DD344C" stroke-width="2"/>
  <rect x="200" y="130" width="130" height="20" rx="6" ry="0" fill="#DD344C"/>
  <text x="265" y="144" text-anchor="middle" font-size="9" fill="#FFFFFF" font-weight="bold">Amazon Cognito</text>
  <text x="265" y="168" text-anchor="middle" font-size="9" fill="#232F3E">User Pool</text>
  <text x="265" y="182" text-anchor="middle" font-size="8" fill="#545B64">JWT Authentication</text>

  <!-- API Gateway -->
  <rect x="200" y="280" width="130" height="80" rx="6" ry="6" fill="#FFFFFF" stroke="#8C4FFF" stroke-width="2"/>
  <rect x="200" y="280" width="130" height="20" rx="6" ry="0" fill="#8C4FFF"/>
  <text x="265" y="294" text-anchor="middle" font-size="9" fill="#FFFFFF" font-weight="bold">API Gateway</text>
  <text x="265" y="316" text-anchor="middle" font-size="9" fill="#232F3E">HTTP API v2</text>
  <text x="265" y="330" text-anchor="middle" font-size="8" fill="#545B64">POST /submissions</text>
  <text x="265" y="344" text-anchor="middle" font-size="8" fill="#545B64">GET /submissions</text>

  <!-- Upload Lambda -->
  <rect x="390" y="240" width="130" height="65" rx="6" ry="6" fill="#FFFFFF" stroke="#ED7100" stroke-width="2"/>
  <rect x="390" y="240" width="130" height="20" rx="6" ry="0" fill="#ED7100"/>
  <text x="455" y="254" text-anchor="middle" font-size="9" fill="#FFFFFF" font-weight="bold">AWS Lambda</text>
  <text x="455" y="275" text-anchor="middle" font-size="9" fill="#232F3E">upload</text>
  <text x="455" y="290" text-anchor="middle" font-size="8" fill="#545B64">Presigned URL + DDB</text>

  <!-- Get Submissions Lambda -->
  <rect x="390" y="330" width="130" height="55" rx="6" ry="6" fill="#FFFFFF" stroke="#ED7100" stroke-width="2"/>
  <rect x="390" y="330" width="130" height="20" rx="6" ry="0" fill="#ED7100"/>
  <text x="455" y="344" text-anchor="middle" font-size="9" fill="#FFFFFF" font-weight="bold">AWS Lambda</text>
  <text x="455" y="365" text-anchor="middle" font-size="9" fill="#232F3E">get-submissions</text>
  <text x="455" y="378" text-anchor="middle" font-size="8" fill="#545B64">Query DynamoDB</text>

  <!-- S3 Bucket -->
  <rect x="580" y="130" width="140" height="80" rx="6" ry="6" fill="#FFFFFF" stroke="#3F8624" stroke-width="2"/>
  <rect x="580" y="130" width="140" height="20" rx="6" ry="0" fill="#3F8624"/>
  <text x="650" y="144" text-anchor="middle" font-size="9" fill="#FFFFFF" font-weight="bold">Amazon S3</text>
  <text x="650" y="168" text-anchor="middle" font-size="9" fill="#232F3E">uploads bucket</text>
  <text x="650" y="182" text-anchor="middle" font-size="8" fill="#545B64">uploads/{user}/{sub}/{file}</text>
  <text x="650" y="196" text-anchor="middle" font-size="8" fill="#545B64">PutObject event →</text>

  <!-- DynamoDB -->
  <rect x="580" y="260" width="140" height="75" rx="6" ry="6" fill="#FFFFFF" stroke="#3334B9" stroke-width="2"/>
  <rect x="580" y="260" width="140" height="20" rx="6" ry="0" fill="#3334B9"/>
  <text x="650" y="274" text-anchor="middle" font-size="9" fill="#FFFFFF" font-weight="bold">Amazon DynamoDB</text>
  <text x="650" y="296" text-anchor="middle" font-size="9" fill="#232F3E">submissions</text>
  <text x="650" y="310" text-anchor="middle" font-size="8" fill="#545B64">PK: submission_id</text>
  <text x="650" y="323" text-anchor="middle" font-size="8" fill="#545B64">GSI: user-uploads-index</text>

  <!-- Confirm Upload Lambda -->
  <rect x="790" y="130" width="140" height="70" rx="6" ry="6" fill="#FFFFFF" stroke="#ED7100" stroke-width="2"/>
  <rect x="790" y="130" width="140" height="20" rx="6" ry="0" fill="#ED7100"/>
  <text x="860" y="144" text-anchor="middle" font-size="9" fill="#FFFFFF" font-weight="bold">AWS Lambda</text>
  <text x="860" y="168" text-anchor="middle" font-size="9" fill="#232F3E">confirm-upload</text>
  <text x="860" y="182" text-anchor="middle" font-size="8" fill="#545B64">S3 event → SQS msg</text>

  <!-- SQS Queue -->
  <rect x="990" y="130" width="140" height="70" rx="6" ry="6" fill="#FFFFFF" stroke="#FF4F8B" stroke-width="2"/>
  <rect x="990" y="130" width="140" height="20" rx="6" ry="0" fill="#FF4F8B"/>
  <text x="1060" y="144" text-anchor="middle" font-size="9" fill="#FFFFFF" font-weight="bold">Amazon SQS</text>
  <text x="1060" y="168" text-anchor="middle" font-size="9" fill="#232F3E">preparation-input</text>
  <text x="1060" y="182" text-anchor="middle" font-size="8" fill="#545B64">Standard Queue</text>

  <!-- SNS Topic -->
  <rect x="790" y="260" width="140" height="65" rx="6" ry="6" fill="#FFFFFF" stroke="#FF4F8B" stroke-width="2"/>
  <rect x="790" y="260" width="140" height="20" rx="6" ry="0" fill="#FF4F8B"/>
  <text x="860" y="274" text-anchor="middle" font-size="9" fill="#FFFFFF" font-weight="bold">Amazon SNS</text>
  <text x="860" y="296" text-anchor="middle" font-size="9" fill="#232F3E">errors</text>
  <text x="860" y="310" text-anchor="middle" font-size="8" fill="#545B64">Error notifications</text>

  <!-- Preparation Workflow (downstream) -->
  <rect x="970" y="250" width="170" height="80" rx="6" ry="6" fill="#F2F3F3" stroke="#232F3E" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="1055" y="275" text-anchor="middle" font-size="9" fill="#232F3E" font-weight="bold">Preparation Workflow</text>
  <text x="1055" y="292" text-anchor="middle" font-size="8" fill="#545B64">EventBridge Pipe</text>
  <text x="1055" y="305" text-anchor="middle" font-size="8" fill="#545B64">→ Step Functions</text>
  <text x="1055" y="318" text-anchor="middle" font-size="8" fill="#545B64">(downstream consumer)</text>

  <!-- Flow arrows -->
  <!-- User → API Gateway -->
  <line x1="150" y1="340" x2="195" y2="320" stroke="#545B64" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <text x="170" y="318" text-anchor="middle" font-size="7" fill="#545B64">HTTPS</text>

  <!-- User → S3 (presigned upload) -->
  <path d="M 150 330 Q 300 100, 575 165" fill="none" stroke="#FF9900" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrowhead-orange)"/>
  <text x="350" y="115" text-anchor="middle" font-size="7" fill="#FF9900">Presigned PUT</text>

  <!-- API GW → Cognito (auth) -->
  <line x1="265" y1="280" x2="265" y2="205" stroke="#545B64" stroke-width="1" stroke-dasharray="3,3" marker-end="url(#arrowhead)"/>
  <text x="280" y="245" text-anchor="start" font-size="7" fill="#545B64">JWT verify</text>

  <!-- API GW → Upload Lambda -->
  <line x1="330" y1="300" x2="385" y2="278" stroke="#545B64" stroke-width="1.5" marker-end="url(#arrowhead)"/>

  <!-- API GW → Get Submissions Lambda -->
  <line x1="330" y1="340" x2="385" y2="352" stroke="#545B64" stroke-width="1.5" marker-end="url(#arrowhead)"/>

  <!-- Upload Lambda → S3 -->
  <line x1="490" y1="240" x2="580" y2="185" stroke="#545B64" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <text x="530" y="205" text-anchor="middle" font-size="7" fill="#545B64">presigned URL</text>

  <!-- Upload Lambda → DynamoDB -->
  <line x1="520" y1="280" x2="575" y2="290" stroke="#545B64" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <text x="545" y="278" text-anchor="middle" font-size="7" fill="#545B64">PutItem</text>

  <!-- Get Submissions → DynamoDB -->
  <line x1="520" y1="355" x2="575" y2="310" stroke="#545B64" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <text x="555" y="340" text-anchor="middle" font-size="7" fill="#545B64">Query</text>

  <!-- S3 → Confirm Upload (event) -->
  <line x1="720" y1="165" x2="785" y2="165" stroke="#FF9900" stroke-width="1.5" marker-end="url(#arrowhead-orange)"/>
  <text x="752" y="157" text-anchor="middle" font-size="7" fill="#FF9900">S3 Event</text>

  <!-- Confirm Upload → SQS -->
  <line x1="930" y1="165" x2="985" y2="165" stroke="#545B64" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <text x="958" y="157" text-anchor="middle" font-size="7" fill="#545B64">SendMessage</text>

  <!-- Confirm Upload → DynamoDB -->
  <line x1="860" y1="200" x2="720" y2="270" stroke="#545B64" stroke-width="1" stroke-dasharray="3,3" marker-end="url(#arrowhead)"/>
  <text x="800" y="230" text-anchor="middle" font-size="7" fill="#545B64">GetItem</text>

  <!-- Confirm Upload → SNS (on error) -->
  <line x1="860" y1="200" x2="860" y2="255" stroke="#545B64" stroke-width="1" stroke-dasharray="3,3" marker-end="url(#arrowhead)"/>
  <text x="875" y="230" text-anchor="start" font-size="7" fill="#545B64">on error</text>

  <!-- SQS → Preparation Workflow -->
  <line x1="1060" y1="200" x2="1060" y2="245" stroke="#545B64" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <text x="1075" y="225" text-anchor="start" font-size="7" fill="#545B64">EventBridge Pipe</text>

  <!-- Legend -->
  <rect x="50" y="620" width="350" height="90" rx="6" ry="6" fill="#F9FAFB" stroke="#D5DBDB" stroke-width="1"/>
  <text x="70" y="640" font-size="10" font-weight="bold" fill="#232F3E">Legend</text>

  <line x1="70" y1="655" x2="110" y2="655" stroke="#545B64" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <text x="120" y="659" font-size="9" fill="#545B64">Data flow</text>

  <line x1="70" y1="675" x2="110" y2="675" stroke="#FF9900" stroke-width="1.5" marker-end="url(#arrowhead-orange)"/>
  <text x="120" y="679" font-size="9" fill="#FF9900">Event-driven trigger</text>

  <line x1="70" y1="695" x2="110" y2="695" stroke="#545B64" stroke-width="1" stroke-dasharray="3,3" marker-end="url(#arrowhead)"/>
  <text x="120" y="699" font-size="9" fill="#545B64">Secondary / error path</text>

  <!-- Service color legend -->
  <rect x="250" y="648" width="12" height="12" fill="#ED7100"/>
  <text x="268" y="659" font-size="9" fill="#545B64">Lambda</text>

  <rect x="250" y="665" width="12" height="12" fill="#3F8624"/>
  <text x="268" y="676" font-size="9" fill="#545B64">S3</text>

  <rect x="250" y="682" width="12" height="12" fill="#3334B9"/>
  <text x="268" y="693" font-size="9" fill="#545B64">DynamoDB</text>

  <rect x="320" y="648" width="12" height="12" fill="#FF4F8B"/>
  <text x="338" y="659" font-size="9" fill="#545B64">SQS / SNS</text>

  <rect x="320" y="665" width="12" height="12" fill="#8C4FFF"/>
  <text x="338" y="676" font-size="9" fill="#545B64">API Gateway</text>

  <rect x="320" y="682" width="12" height="12" fill="#DD344C"/>
  <text x="338" y="693" font-size="9" fill="#545B64">Cognito</text>

  <!-- Data flow description -->
  <rect x="450" y="620" width="700" height="90" rx="6" ry="6" fill="#F9FAFB" stroke="#D5DBDB" stroke-width="1"/>
  <text x="470" y="640" font-size="10" font-weight="bold" fill="#232F3E">Flow Summary</text>
  <text x="470" y="658" font-size="9" fill="#545B64">1. User authenticates via Cognito hosted UI → receives JWT token</text>
  <text x="470" y="672" font-size="9" fill="#545B64">2. POST /submissions → Upload Lambda creates DDB record + returns presigned S3 URL</text>
  <text x="470" y="686" font-size="9" fill="#545B64">3. Browser uploads file directly to S3 using presigned URL</text>
  <text x="470" y="700" font-size="9" fill="#545B64">4. S3 PutObject event → Confirm Upload Lambda → publishes SQS message to Preparation Workflow</text>
</svg>
